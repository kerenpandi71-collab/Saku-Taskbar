name: CI Check

on:
  workflow_dispatch:
  push:
    branches:
    - master
  pull_request:
    branches:
    - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '21'
    - name: Build
      run: ./gradlew assembleFreeDebug
    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: Saku-Taskbar-FreeDebug
        path: app/build/outputs/apk/free/debug/*.apk
        if-no-files-found: error
        retention-days: 7
    - name: Spotless Check (non-blocking style check)
      continue-on-error: true
      run: ./gradlew spotlessCheck
    - name: Unit tests (temporarily skipped)
      if: false
      run: ./gradlew testFreeDebug
    - name: Upload test reports for diagnosis
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Saku-Taskbar-Test-Reports
        path: |
          app/build/test-results/testFreeDebugUnitTest/**/*.xml
          app/build/reports/tests/testFreeDebugUnitTest/**
        if-no-files-found: warn
        retention-days: 7
